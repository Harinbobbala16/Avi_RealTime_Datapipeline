resources:
  jobs:
    Avi_RealTime_Job:
      name: Avi_RealTime_Datapipeline_Prod
      job_clusters:
                - job_cluster_key: main_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
      tasks:
                - task_key: bronze_task
          job_cluster_key: main_cluster
          spark_python_task:
            python_file: ./bronze_ingest.py
                - task_key: silver_task
          job_cluster_key: main_cluster
          depends_on:
                        - task_key: bronze_task
          spark_python_task:
            python_file: ./silver_transform.py
